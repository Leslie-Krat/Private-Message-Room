# Included inside each Zero-Room server { } block, so both hostnames behave identically.
# Install as /etc/nginx/snippets/zeroroom_locations.conf

server_tokens off;
# Memory: a WebSocket connection is idle most of the time, so keep per-connection buffers small.
ssl_buffer_size 4k;
client_header_buffer_size 1k;
large_client_header_buffers 2 4k;
client_max_body_size 1k;      # the site only ever serves GET requests
root  /root/Zero-Room/Zero-Room.web;
index index.html;
access_log /var/log/nginx/zeroroom.access.log zeroroom;

if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Never serve dotfiles, docs or config that might sit next to the site.
location ~ /\. { return 404; }
location ~* \.(?:md|conf|service|env|example|map|json|lock|cjs)$ { return 404; }

# The relay's health endpoint is not public (see the note at the bottom).
location = /health { return 404; }

# Fonts never change under the same file name.
location /fonts/ {
    limit_req zone=zeroroom_req burst=50 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/zeroroom_security_headers.conf;
    try_files $uri =404;
}

# Pages, scripts and styles revalidate on every load (cheap, thanks to ETag) so updates arrive at once.
location / {
    limit_req zone=zeroroom_req burst=50 nodelay;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/zeroroom_security_headers.conf;
    try_files $uri $uri/ /index.html;
}

# WebSocket relay. Rooms are never written to any log, and the relay stays bound to 127.0.0.1.
location = /ws {
    if ($zr_origin_ok = 0) { return 403; }
    limit_req  zone=zeroroom_ws   burst=10 nodelay;
    limit_conn zeroroom_conn 30;
    access_log off;

    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    # Overwrite, never append: the relay must not trust anything a client put in these headers.
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    # The relay pings every 25 s, so idle or half-open connections are cut after 2 minutes.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
# The relay's /health and /metrics are deliberately NOT exposed. Check them on the server:
#   curl -s http://127.0.0.1:8888/health
