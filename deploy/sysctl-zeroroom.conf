# Kernel settings for thousands of mostly idle WebSocket connections on a small VPS.
# Install: sudo cp sysctl-zeroroom.conf /etc/sysctl.d/90-zeroroom.conf && sudo sysctl --system

# Let nginx queue bursts of new connections (for example everyone reconnecting after a restart)
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Free the sockets of clients that vanished sooner
net.ipv4.tcp_fin_timeout = 20

# Prefer dropping file cache over swapping the relay out
vm.swappiness = 10
