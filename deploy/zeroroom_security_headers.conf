# Included by every location that serves content (add_header is not inherited across locations).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Everything (scripts, styles, fonts, QR code library, proof-of-work worker) is served from this origin; no CDN, no inline code.
# media-src blob: plays received voice notes; the microphone is allowed for this origin only (voice notes).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; connect-src 'self' wss://chat.example.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
