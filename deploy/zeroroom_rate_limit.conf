# Zero-Room: shared nginx settings. This file must be included at http{} level
# (for example /etc/nginx/conf.d/zeroroom_rate_limit.conf).

# Request-rate and connection limits per client address.
limit_req_zone  $binary_remote_addr zone=zeroroom_ws:10m  rate=15r/s;
limit_req_zone  $binary_remote_addr zone=zeroroom_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=zeroroom_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Only pages served from our own hostnames may open the WebSocket (blocks cross-site hijacking).
# Replace chat.example.com with your hostname. If you add a domain, add it here as well.
map $http_origin $zr_origin_ok {
    default 0;
    "~^https://chat\.example\.com$" 1;
}

# Access log format without query strings or anything room related.
log_format zeroroom '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
