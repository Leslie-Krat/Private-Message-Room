# Zero-Room site definition. Replace chat.example.com with your own hostname (certbot manages the ssl_* lines).
# Needs: zeroroom_rate_limit.conf (http level) and the two snippets in /etc/nginx/snippets/.

server {
    server_name chat.example.com;
    include /etc/nginx/snippets/zeroroom_locations.conf;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chat.example.com) {
        return 301 https://$host$request_uri;
    }
    server_name chat.example.com;
    listen 80;
    listen [::]:80;
    server_tokens off;
    return 404;
}
